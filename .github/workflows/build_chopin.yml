name: Build Chopin (MT6891) Kernel with KernelSU

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        type: choice
        options: [release, debug]
        default: release

env:
  KERNEL_DIR: kernel/xiaomi/chopin
  DEFCONFIG: chopin_user
  BUILD_TYPE: ${{ github.event.inputs.build_type }}
  KSU_VERSION: v0.9.5
  CCACHE_DIR: /tmp/ccache
  KBUILD_BUILD_USER: "@Xinran_StarBai"
  KBUILD_BUILD_HOST: "Xinran"
  KBUILD_BUILD_TIMESTAMP: "$(date -u +'%Y-%m-%d %H:%M:%S')"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      # 1. Checkout kernel source
      - name: Checkout kernel source (xinran branch)
        uses: actions/checkout@v4
        with:
          repository: lbm76/xinran_xiaomi_kernel_chopin
          ref: xinran
          path: ${{ env.KERNEL_DIR }}
          submodules: recursive

      # 2. KernelSU patch (curl official setup.sh)
      - name: Fetch & Patch KernelSU
        id: ksu
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          KERNEL_SRC_DIR="${GITHUB_WORKSPACE}/${{ env.KERNEL_DIR }}"
          
          echo "Fetching KernelSU setup.sh (${{ env.KSU_VERSION }}) ..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "${{ env.KSU_VERSION }}" "$KERNEL_SRC_DIR" 2>&1 | tee ksu_patch.log
          
          echo "ksu_version=${{ env.KSU_VERSION }}" >> $GITHUB_OUTPUT
          echo "KernelSU patched"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            coreutils \
            git make bc bison ccache openssl dos2unix zip kmod cpio flex libelf-dev \
            curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates \
            python3 python2 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            libncurses5-dev libssl-dev libelf-dev lz4 lzop zstd
          
          command -v make nproc gcc clang
          make --version
          nproc

      # 4. Download GCC 4.9 (with auto-detection of actual binary paths)
      - name: Download GCC 4.9
        id: download_gcc
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/kernel_workspace
          cd ${GITHUB_WORKSPACE}/kernel_workspace
          
          mkdir gcc64
          wget -O gcc-aarch64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          tar -C gcc64/ -zxvf gcc-aarch64.tar.gz
      
          mkdir gcc32
          wget -O gcc-arm.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          tar -C gcc32/ -zxvf gcc-arm.tar.gz
          
          # Auto-detect actual gcc binary paths
          GCC64_BIN=$(find gcc64 -name "aarch64-linux-android-gcc" -type f | head -1)
          GCC32_BIN=$(find gcc32 -name "arm-linux-androideabi-gcc" -type f | head -1)
          
          if [ -z "$GCC64_BIN" ] || [ -z "$GCC32_BIN" ]; then
            echo "❌ GCC binary not found! Listing extracted structure:"
            find gcc64 -type f | head -20
            find gcc32 -type f | head -20
            exit 1
          fi
          
          echo "GCC64_BIN=$GCC64_BIN" >> $GITHUB_OUTPUT
          echo "GCC32_BIN=$GCC32_BIN" >> $GITHUB_OUTPUT
          echo "Found GCC64: $GCC64_BIN"
          echo "Found GCC32: $GCC32_BIN"

      # 5. Download Clang
      - name: Download Clang
        run: |
          cd ${GITHUB_WORKSPACE}/kernel_workspace
          mkdir clang-aosp
          git clone -q --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 -b 10.0 clang-aosp

      # 6. ccache cache
      - name: Cache ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-kernel-chopin-ksu
          max-size: 5G

      # 7. Configure & Build kernel (with full error capture & fallbacks)
      - name: Configure & Build kernel
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          PATH: ${GITHUB_WORKSPACE}/kernel_workspace/clang-aosp/bin:${PATH}
          KBUILD_BUILD_HOST: ${{ env.KBUILD_BUILD_HOST }}
          KBUILD_BUILD_USER: ${{ env.KBUILD_BUILD_USER }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
        run: |
          set -euo pipefail
          export PATH="${PATH}"
          
          # Verify toolchain - use absolute paths
          CLANG_BIN="${GITHUB_WORKSPACE}/kernel_workspace/clang-aosp/bin/clang"
          GCC64_BIN="${{ steps.download_gcc.outputs.GCC64_BIN }}"
          GCC32_BIN="${{ steps.download_gcc.outputs.GCC32_BIN }}"
          
          command -v "${CLANG_BIN}" "${GCC64_BIN}" "${GCC32_BIN}" make nproc
          "${CLANG_BIN}" --version
          "${GCC64_BIN}" --version
          
          # Find defconfig (fallback if chopin_user_defconfig doesn't exist)
          DEFCONFIG_FILE=""
          for f in "arch/arm64/configs/${DEFCONFIG}_defconfig" "arch/arm64/configs/vendor/${DEFCONFIG}_defconfig" "arch/arm64/configs/${DEFCONFIG}.defconfig"; do
            if [ -f "$f" ]; then
              DEFCONFIG_FILE="$f"
              break
            fi
          done
          
          if [ -z "$DEFCONFIG_FILE" ]; then
            echo "❌ Defconfig not found. Available defconfigs:"
            find arch/arm64/configs -name "*chopin*" -o -name "*${DEFCONFIG}*" 2>/dev/null | head -20
            exit 1
          fi
          echo "Using defconfig: $DEFCONFIG_FILE"
          
          # Generate .config
          make -s -j$(nproc --all) O=out ARCH=arm64 "${DEFCONFIG_FILE%_defconfig}"
          
          # KernelSU required configs (with fallbacks for option name differences)
          scripts/config --enable KSU || true
          scripts/config --enable KSU_DAEMON || true
          scripts/config --enable KPROBES || true
          scripts/config --enable KPROBE_EVENTS || true
          scripts/config --disable MODULE_SIG || true
          scripts/config --disable MODULE_SIG_ALL || true
          scripts/config --disable MODULE_SIG_SHA256 || true
          scripts/config --disable DEBUG_INFO || true
          scripts/config --disable DEBUG_KERNEL || true
          scripts/config --disable KALLSYMS || true
          scripts/config --disable KALLSYMS_ALL || true
          
          make -s -j$(nproc --all) O=out ARCH=arm64 olddefconfig
          
          echo "=== Key config verification ==="
          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_MODULE_SIG" out/.config || true
          
          # Build kernel - use absolute clang path and gcc paths
          make -j$(nproc --all) CC="${CLANG_BIN}" O=out ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$(dirname "${GCC64_BIN}")/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="$(dirname "${GCC32_BIN}")/arm-linux-androideabi-" \
            LD=ld.lld \
            2>&1 | tee build.log
          
          # Check result
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ Kernel Image not found!"
            echo "=== Last 50 lines of build.log ==="
            tail -50 build.log
            exit 1
          fi
          
          if [ -f out/drivers/kernel/ksu/ksu.ko ]; then
            echo "✅ KSU module (ksu.ko) built"
          elif [ -f out/drivers/kernel/ksu/ksu.o ]; then
            echo "✅ KSU built-in"
          else
            echo "⚠️ KSU object not found"
            find out -name "*ksu*" -type f 2>/dev/null | head -10
          fi
          
          echo "✅ Kernel Image built successfully"

      # 8. Build DTB
      - name: Build DTB
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          PATH: ${GITHUB_WORKSPACE}/kernel_workspace/clang-aosp/bin:${PATH}
        run: |
          make O=out ARCH=arm64 dtbs -j$(nproc --all) 2>&1 | tee -a build.log

      # 9. Package kernel images
      - name: Package kernel images
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          cd out/arch/arm64/boot
          
          gzip -c -9 Image > Image.gz
          lz4 -c -l -9 Image > Image.lz4
          
          DTB_FILES=""
          for d in ../dtb/ dts/; do
            if [ -d "$d" ]; then
              DTB_FILES=$(find "$d" -name "*.dtb" -type f 2>/dev/null | head -50)
              [ -n "$DTB_FILES" ] && break
            fi
          done
          
          if [ -n "$DTB_FILES" ]; then
            echo "Found DTBs: $DTB_FILES"
            cat Image.gz $DTB_FILES > Image.gz-dtb
            cat Image.lz4 $DTB_FILES > Image.lz4-dtb
          else
            echo "No DTB found"
            cp Image.gz Image.gz-dtb
            cp Image.lz4 Image.lz4-dtb
          fi
          
          mkdir -p ../../../../artifact
          cp Image.gz Image.gz-dtb Image.lz4 Image.lz4-dtb ../../../../artifact/
          cp ../dtb/*.dtb ../../../../artifact/ 2>/dev/null || true
          cp .config ../../../../artifact/config_final
          
          if [ -f ../drivers/kernel/ksu/ksu.ko ]; then
            cp ../drivers/kernel/ksu/ksu.ko ../../../../artifact/
            echo "KSU module copied to artifacts"
          fi

      # 10. AnyKernel3 ZIP
      - name: Package AnyKernel3
        if: github.event.inputs.build_type == 'release'
        run: |
          cd ${GITHUB_WORKSPACE}
          git clone https://github.com/Winkmoon/AnyKernel3
          cp ${GITHUB_WORKSPACE}/${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          rm -rf AnyKernel3/.git* AnyKernel3/README.md
          cd AnyKernel3
          zip -r ../artifact/ShirokoNeko-kernel-FolkPatch-KSU.zip .

      # 11. Magisk Module
      - name: Package Magisk Module
        if: github.event.inputs.build_type == 'release'
        run: |
          cd ${GITHUB_WORKSPACE}
          mkdir -p magisk_module/kernel
          cp ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz-dtb magisk_module/kernel/
          
          if [ -f ${{ env.KERNEL_DIR }}/out/drivers/kernel/ksu/ksu.ko ]; then
            mkdir -p magisk_module/modules
            cp ${{ env.KERNEL_DIR }}/out/drivers/kernel/ksu/ksu.ko magisk_module/modules/
          fi
          
          cat > magisk_module/module.prop << MAGEOF
          id=xinran_ksu_kernel_chopin
          name=Xinran Kernel + KSU (Chopin MT6891)
          version=$(date +%Y%m%d)
          versionCode=$(date +%s)
          author=lbm76/Xinran + tiann/KernelSU
          description=Dimensity 1100 kernel with KernelSU (stock frequencies/voltages)
          minMagisk=23000
          MAGEOF
          
          cat > magisk_module/customize.sh << 'SHOEF'
          #!/bin/sh
          SKIPMOUNT=false
          PROPFILE=false
          POSTFSDATA=true
          LATESTARTSERVICE=false
          
          on_install() {
            ui_print "- Installing Xinran Kernel + KSU for Chopin..."
            ui_print "- Flashing boot image..."
            if [ -f $MODPATH/modules/ksu.ko ]; then
              ui_print "- Installing KernelSU module..."
            fi
            ui_print "- Done! Reboot to take effect."
          }
          SHOEF
          
          cd magisk_module
          zip -r9 ../artifact/Magisk-Xinran-KSU-Chopin-$(date +%Y%m%d).zip .
          echo "Magisk module ZIP created"

      # 12. Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xinran-ksu-chopin-${{ env.BUILD_TYPE }}-${{ github.run_number }}
          path: |
            artifact/
            ${{ env.KERNEL_DIR }}/build.log
            ${{ env.KERNEL_DIR }}/ksu_patch.log
          retention-days: 30

      # 13. Create Release
      - name: Create Release
        if: github.event.inputs.build_type == 'release' && github.repository_owner == github.actor
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v$(date +'%Y.%m.%d')-${{ github.run_number }}
          name: "Xinran+KSU Chopin (MT6891) $(date +'%Y.%m.%d')"
          body: |
            **Redmi Note 10 Pro (chopin) - Dimensity 1100 (MT6891)**
            
            **Build Env (from your working workflow)**
            - Ubuntu 22.04 + crDroid Clang-6443078 (10.0) + GCC 4.9 (android-12.1.0_r27)
            - Kernel: `lbm76/xinran_xiaomi_kernel_chopin@xinran` (4.14)
            - KernelSU: `tiann/KernelSU@v0.9.5`
            
            **Features**
            - KernelSU support (module or built-in)
            - Stock frequencies & voltages (no OC/UV)
            
            **Artifacts**
            - `ShirokoNeko-kernel-FolkPatch-KSU.zip` -> **Recovery flash**
            - `Magisk-Xinran-KSU-Chopin-*.zip` -> Magisk module
            - `ksu.ko` + `config_final` + `build.log`
          files: artifact/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
