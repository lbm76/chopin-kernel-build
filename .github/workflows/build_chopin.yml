name: Build Chopin (MT6891) Kernel with KernelSU

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '编译类型'
        type: choice
        options: [release, debug]
        default: release

env:
  KERNEL_DIR: kernel/xiaomi/chopin
  DEFCONFIG: chopin_user
  BUILD_TYPE: ${{ github.event.inputs.build_type }}
  KSU_VERSION: v0.9.5
  CCACHE_DIR: /tmp/ccache
  KBUILD_BUILD_USER: "Xinran_StarBai"
  KBUILD_BUILD_HOST: "Xinran"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Generate build metadata
        run: |
          echo "BUILD_TS=$(date -u +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
          echo "TAG=v$(date +'%Y.%m.%d')-${{ github.run_number }}" >> $GITHUB_ENV
          echo "VER_CODE=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      - name: Disk space check & cleanup
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /opt/hostedtoolcache/* 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf ~/.cache 2>/dev/null || true
          sudo apt-get clean
          echo "=== After cleanup ==="
          df -h /

      - name: Checkout kernel source (xinran branch)
        uses: actions/checkout@v4
        with:
          repository: lbm76/xinran_xiaomi_kernel_chopin
          ref: xinran
          path: ${{ env.KERNEL_DIR }}
          submodules: recursive

      - name: Fetch & Patch KernelSU
        id: ksu
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          KERNEL_SRC_DIR="${GITHUB_WORKSPACE}/${{ env.KERNEL_DIR }}"
          
          echo "Fetching KernelSU setup.sh (${{ env.KSU_VERSION }}) ..."
          for i in 1 2 3; do
            if curl -LSs --connect-timeout 30 --max-time 60 \
              "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | \
              bash -s "${{ env.KSU_VERSION }}" "$KERNEL_SRC_DIR" 2>&1 | tee ksu_patch.log; then
              echo "✅ KernelSU patched (attempt $i)"
              break
            fi
            echo "⚠️ Attempt $i failed, retrying..."
            sleep 5
          done
          
          if grep -r "CONFIG_KSU" "$KERNEL_SRC_DIR" --include="Kconfig*" | head -3; then
            echo "✅ KSU Kconfig entries found"
          else
            echo "❌ KSU patch may have failed"
            cat ksu_patch.log
            exit 1
          fi
          
          echo "ksu_version=${{ env.KSU_VERSION }}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            coreutils \
            git make bc bison ccache openssl dos2unix zip kmod cpio flex libelf-dev \
            curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates \
            python3 python2-minimal binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            libncurses5-dev libssl-dev libelf-dev lz4 lzop zstd
          
          for cmd in make nproc gcc clang; do
            command -v "$cmd" || { echo "$cmd not found"; exit 1; }
          done
          make --version
          nproc

      - name: Download toolchains
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/kernel_workspace
          cd ${GITHUB_WORKSPACE}/kernel_workspace
          
          echo "=== Downloading GCC 64-bit ==="
          if ! git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 -b lineage-19.1 gcc64 2>&1; then
            echo "LineageOS mirror failed, trying ndk-toolchain..."
            git clone --depth=1 https://github.com/ndk-toolchain/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 -b master gcc64
          fi
          ls gcc64/bin/aarch64-linux-android-gcc
          
          echo "=== Downloading GCC 32-bit ==="
          if ! git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 -b lineage-19.1 gcc32 2>&1; then
            echo "LineageOS mirror failed, trying ndk-toolchain..."
            git clone --depth=1 https://github.com/ndk-toolchain/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 -b master gcc32
          fi
          ls gcc32/bin/arm-linux-androideabi-gcc
          
          echo "=== Downloading Clang ==="
          git clone -q --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 -b 10.0 clang-aosp
          
          echo "=== Clang directory structure ==="
          CLANG_PATH=$(find clang-aosp -name clang -type f | head -1)
          echo "Found clang at: $CLANG_PATH"
          CLANG_BIN_DIR=$(dirname "$CLANG_PATH")
          echo "CLANG_BIN_DIR=$CLANG_BIN_DIR" >> $GITHUB_ENV
          ls -la "$CLANG_BIN_DIR"/

      - name: Cache ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-kernel-chopin-ksu-${{ env.BUILD_TYPE }}-${{ env.KSU_VERSION }}-${{ hashFiles(env.KERNEL_DIR + '/.git/HEAD') }}
          max-size: 5G

      - name: Configure & Build kernel
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          PATH: ${{ env.CLANG_BIN_DIR }}:${{ github.workspace }}/kernel_workspace/gcc64/bin:${{ github.workspace }}/kernel_workspace/gcc32/bin:${PATH}
          KBUILD_BUILD_HOST: ${{ env.KBUILD_BUILD_HOST }}
          KBUILD_BUILD_USER: ${{ env.KBUILD_BUILD_USER }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.BUILD_TS }}
        run: |
          export PATH="${PATH}"
          
          for cmd in clang aarch64-linux-android-gcc make nproc; do
            command -v "$cmd" || { echo "$cmd not found"; exit 1; }
          done
          echo "=== Toolchain versions ==="
          clang --version
          aarch64-linux-android-gcc --version
          ld.lld --version
          
          echo "=== Available defconfigs ==="
          ls arch/arm64/configs/*chopin* 2>/dev/null || ls arch/arm64/configs/ | head -20
          
          make -s -j$(nproc --all) O=out ARCH=arm64 ${DEFCONFIG}_defconfig
          
          [ -x scripts/config ] || { echo "scripts/config missing"; exit 1; }
          
          scripts/config --enable KSU
          scripts/config --enable KSU_DAEMON
          scripts/config --enable KPROBES
          scripts/config --enable KPROBE_EVENTS
          scripts/config --disable MODULE_SIG
          scripts/config --disable MODULE_SIG_ALL
          scripts/config --disable MODULE_SIG_SHA256
          scripts/config --disable MODULE_SIG_KEY
          scripts/config --disable DEBUG_INFO
          scripts/config --disable DEBUG_KERNEL
          
          make -s -j$(nproc --all) O=out ARCH=arm64 olddefconfig
          
          echo "=== 关键配置校验 ==="
          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_MODULE_SIG|CONFIG_KALLSYMS" out/.config || true
          
          make -j$(nproc --all) \
            CC="ccache clang" \
            LD="ld.lld" \
            AS="llvm-as" \
            AR="llvm-ar" \
            NM="llvm-nm" \
            OBJCOPY="llvm-objcopy" \
            OBJDUMP="llvm-objdump" \
            STRIP="llvm-strip" \
            CLANG_TRIPLE=aarch64-linux-android- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            O=out ARCH=arm64 \
            2>&1 | tee build.log
          
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ Kernel Image not found!"
            tail -100 build.log
            exit 1
          fi
          
          if [ -f out/drivers/kernel/ksu/ksu.ko ]; then
            echo "✅ KSU module (ksu.ko) built"
          elif grep -q "CONFIG_KSU=y" out/.config; then
            echo "✅ KSU built-in (CONFIG_KSU=y)"
          else
            echo "⚠️ KSU not found in build output"
            find out -name "*ksu*" -type f 2>/dev/null | head -10
          fi
          
          echo "✅ Kernel Image built successfully"

      - name: Build DTB
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          PATH: ${{ env.CLANG_BIN_DIR }}:${{ github.workspace }}/kernel_workspace/gcc64/bin:${{ github.workspace }}/kernel_workspace/gcc32/bin:${PATH}
        run: |
          echo "=== Checking available DTB targets ==="
          make O=out ARCH=arm64 help | grep -i dtb || true
          make O=out ARCH=arm64 dtbs -j$(nproc --all) 2>&1 | tee -a build.log

      - name: Package kernel images
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          KERNEL_SRC_DIR="${GITHUB_WORKSPACE}/${{ env.KERNEL_DIR }}"
          cd out/arch/arm64/boot
          
          gzip -c -9 Image > Image.gz
          lz4 -c -l -9 Image > Image.lz4
          
          DTB_DIR="${KERNEL_SRC_DIR}/out/arch/arm64/boot"
          DTB_FILES=$(find "$DTB_DIR" -name "*.dtb" -type f 2>/dev/null | sort | head -50)
          
          if [ -n "$DTB_FILES" ]; then
            echo "Found DTBs:"
            echo "$DTB_FILES"
            cat Image.gz > Image.gz-dtb
            echo "$DTB_FILES" | xargs -r cat >> Image.gz-dtb
            cat Image.lz4 > Image.lz4-dtb
            echo "$DTB_FILES" | xargs -r cat >> Image.lz4-dtb
          else
            echo "⚠️ No DTB found"
            cp Image.gz Image.gz-dtb
            cp Image.lz4 Image.lz4-dtb
          fi
          
          mkdir -p ../../../../artifact
          cp Image.gz Image.gz-dtb Image.lz4 Image.lz4-dtb ../../../../artifact/
          find "$DTB_DIR" -name "*.dtb" -type f -exec cp {} ../../../../artifact/ \; 2>/dev/null || true
          cp .config ../../../../artifact/config_final
          
          if [ -f ../drivers/kernel/ksu/ksu.ko ]; then
            cp ../drivers/kernel/ksu/ksu.ko ../../../../artifact/
            echo "✅ KSU module copied to artifacts"
          fi

      - name: Package AnyKernel3
        if: github.event.inputs.build_type == 'release'
        run: |
          cd ${GITHUB_WORKSPACE}
          git clone https://github.com/Winkmoon/AnyKernel3 -b master --depth=1
          cd AnyKernel3
          # git checkout COMMIT_HASH  # 替换为实测可用的 commit hash
          cp ${GITHUB_WORKSPACE}/${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz-dtb .
          rm -rf .git* README.md
          zip -r ../artifact/ShirokoNeko-kernel-FolkPatch-KSU.zip .

      - name: Package Magisk Module
        if: github.event.inputs.build_type == 'release'
        run: |
          cd ${GITHUB_WORKSPACE}
          mkdir -p magisk_module/kernel
          cp ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz-dtb magisk_module/kernel/
          
          if [ -f ${{ env.KERNEL_DIR }}/out/drivers/kernel/ksu/ksu.ko ]; then
            mkdir -p magisk_module/modules
            cp ${{ env.KERNEL_DIR }}/out/drivers/kernel/ksu/ksu.ko magisk_module/modules/
          fi
          
          cat > magisk_module/module.prop << MAGEOF
          id=xinran_ksu_kernel_chopin
          name=Xinran Kernel + KSU (Chopin MT6891)
          version=$(date +%Y%m%d)
          versionCode=${{ env.VER_CODE }}
          author=lbm76/Xinran + tiann/KernelSU
          description=Dimensity 1100 kernel with KernelSU (stock frequencies/voltages)
          minMagisk=23000
          MAGEOF
          
          cat > magisk_module/customize.sh << 'SHOEF'
          #!/bin/sh
          SKIPMOUNT=false
          PROPFILE=false
          POSTFSDATA=true
          LATESTARTSERVICE=false
          
          on_install() {
            ui_print "- Installing Xinran Kernel + KSU for Chopin..."
            ui_print "- Flashing boot image..."
            if [ -f \$MODPATH/modules/ksu.ko ]; then
              ui_print "- Installing KernelSU module..."
            fi
            ui_print "- Done! Reboot to take effect."
          }
          SHOEF
          
          cd magisk_module
          zip -r9 ../artifact/Magisk-Xinran-KSU-Chopin-$(date +%Y%m%d).zip .
          echo "✅ Magisk module ZIP created"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xinran-ksu-chopin-${{ env.BUILD_TYPE }}-${{ github.run_number }}
          path: |
            artifact/
            ${{ env.KERNEL_DIR }}/build.log
            ${{ env.KERNEL_DIR }}/ksu_patch.log
            ${{ env.KERNEL_DIR }}/out/.config
          retention-days: 30

      - name: Create Release
        if: github.event.inputs.build_type == 'release' && success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG }}
          name: "Xinran+KSU Chopin (MT6891) $(date +'%Y.%m.%d')"
          body: |
            **Redmi Note 10 Pro (chopin) - Dimensity 1100 (MT6891)**
            
            **Build Env**
            - Ubuntu 22.04 + crDroid Clang-6443078 (10.0) + GCC 4.9 (LineageOS 19.1 mirror)
            - Kernel: `lbm76/xinran_xiaomi_kernel_chopin@xinran` (4.14)
            - KernelSU: `tiann/KernelSU@v0.9.5`
            
            **Features**
            - KernelSU support (module or built-in)
            - Stock frequencies & voltages (no OC/UV)
            
            **Artifacts**
            - `ShirokoNeko-kernel-FolkPatch-KSU.zip` → **Recovery 刷入**
            - `Magisk-Xinran-KSU-Chopin-*.zip` → Magisk 模块
            - `ksu.ko` + `config_final` + `build.log`
          files: artifact/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
