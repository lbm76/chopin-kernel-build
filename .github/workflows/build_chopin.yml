name: Build Chopin (MT6891) Kernel with KernelSU + susfs

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '编译类型'
        type: choice
        options: [release, debug]
        default: release

env:
  KERNEL_DIR: kernel/xiaomi/chopin
  DEFCONFIG: chopin_user
  BUILD_TYPE: ${{ github.event.inputs.build_type }}
  KSU_VERSION: v0.9.5
  SUFS_VERSION: v0.9.5
  CCACHE_DIR: /tmp/ccache
  KBUILD_BUILD_USER: "@Xinran_StarBai"
  KBUILD_BUILD_HOST: "Xinran"
  KBUILD_BUILD_TIMESTAMP: "$(date -u +'%Y-%m-%d %H:%M:%S')"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      # 1️⃣ 拉官方内核源码
      - name: Checkout kernel source (xinran branch)
        uses: actions/checkout@v4
        with:
          repository: lbm76/xinran_xiaomi_kernel_chopin
          ref: xinran
          path: ${{ env.KERNEL_DIR }}
          submodules: recursive

      # 2️⃣ KernelSU 打补丁（curl 直接跑官方 setup.sh）
      - name: Fetch & Patch KernelSU
        id: ksu
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          KERNEL_SRC_DIR="${GITHUB_WORKSPACE}/${{ env.KERNEL_DIR }}"
          
          echo "Fetching KernelSU setup.sh (${{ env.KSU_VERSION }}) ..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "${{ env.KSU_VERSION }}" "$KERNEL_SRC_DIR" 2>&1 | tee ksu_patch.log
          
          echo "ksu_version=${{ env.KSU_VERSION }}" >> $GITHUB_OUTPUT
          echo "✅ KernelSU patched"

      # 3️⃣ 应用 susfs4ksu 补丁
      - name: Apply susfs4ksu patches
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          echo "Fetching susfs4ksu patches (${{ env.SUFS_VERSION }}) ..."
          
          SUFS_TMP=$(mktemp -d)
          cd "$SUFS_TMP"
          
          curl -LSs "https://github.com/sidex15/susfs4ksu/archive/refs/tags/${{ env.SUFS_VERSION }}.tar.gz" | tar -xz
          
          if [ -d "susfs4ksu-${{ env.SUFS_VERSION }}/kernel_patches" ]; then
            PATCH_DIR="susfs4ksu-${{ env.SUFS_VERSION }}/kernel_patches"
          elif [ -d "susfs4ksu-${{ env.SUFS_VERSION }}/patches" ]; then
            PATCH_DIR="susfs4ksu-${{ env.SUFS_VERSION }}/patches"
          else
            echo "❌ 找不到补丁目录"
            find . -name "*.patch" -type f
            exit 1
          fi
          
          echo "Applying patches from $PATCH_DIR ..."
          for patch in "$PATCH_DIR"/*.patch; do
            [ -f "$patch" ] || continue
            echo "Applying $(basename "$patch")"
            git apply --verbose "$patch" 2>&1 | tee -a ../susfs_patch.log || {
              echo "⚠️ git apply 失败，尝试 patch -p1"
              patch -p1 < "$patch" 2>&1 | tee -a ../susfs_patch.log
            }
          done
          
          echo "✅ susfs4ksu patches applied"

      # 4️⃣ 安装编译依赖（强制装 build-essential/coreutils，用 command -v 验证）
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            coreutils \
            git make bc bison ccache openssl dos2unix zip kmod cpio flex libelf-dev \
            curl libssl-dev libtfm-dev wget device-tree-compiler ca-certificates \
            python3 python2 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            libncurses5-dev libssl-dev libelf-dev lz4 lzop zstd
          
          command -v make nproc gcc clang
          make --version
          nproc

      # 5️⃣ 下载 GCC 4.9（完全照搬你的：android-12.1.0_r27 tag）
      - name: Download GCC 4.9
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/kernel_workspace
          cd ${GITHUB_WORKSPACE}/kernel_workspace
          
          mkdir gcc64
          wget -O gcc-aarch64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          tar -C gcc64/ -zxvf gcc-aarch64.tar.gz
      
          mkdir gcc32
          wget -O gcc-arm.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          tar -C gcc32/ -zxvf gcc-arm.tar.gz

      # 6️⃣ 下载 Clang（完全照搬你的：crdroidandroid clang-6443078 10.0 分支）
      - name: Download Clang
        run: |
          cd ${GITHUB_WORKSPACE}/kernel_workspace
          mkdir clang-aosp
          git clone -q --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 -b 10.0 clang-aosp

      # 7️⃣ ccache 缓存（照搬你的）
      - name: Cache ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-kernel-chopin-ksu-sufs
          max-size: 5G

      # ═══════════════════════════════════
      # 8️⃣ 配置并构建内核 —— **完全照搬你给的能跑通工作流**
      # ═══════════════════════════════════
      - name: Configure & Build kernel
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          PATH: ${GITHUB_WORKSPACE}/kernel_workspace/clang-aosp/bin:${GITHUB_WORKSPACE}/kernel_workspace/gcc64/bin:${GITHUB_WORKSPACE}/kernel_workspace/gcc32/bin:${PATH}
          KBUILD_BUILD_HOST: ${{ env.KBUILD_BUILD_HOST }}
          KBUILD_BUILD_USER: ${{ env.KBUILD_BUILD_USER }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
        run: |
          export PATH="${PATH}"
          
          # 验证工具链
          command -v clang aarch64-linux-android-gcc make nproc
          clang --version
          aarch64-linux-android-gcc --version
          
          # 生成 .config（完全照搬你的）
          make -s -j$(nproc --all) O=out ARCH=arm64 ${DEFCONFIG}_defconfig
          
          # KernelSU + susfs 必需配置
          scripts/config --enable KSU
          scripts/config --enable KSU_DAEMON
          scripts/config --enable KPROBES
          scripts/config --enable KPROBE_EVENTS
          scripts/config --disable MODULE_SIG
          scripts/config --disable MODULE_SIG_ALL
          scripts/config --disable MODULE_SIG_SHA256
          scripts/config --disable DEBUG_INFO
          scripts/config --disable DEBUG_KERNEL
          scripts/config --disable KALLSYMS
          
          # susfs 专用配置
          scripts/config --enable KSU_SUSFS 2>/dev/null || true
          scripts/config --enable KSU_SUSFS_SUS_MOUNT 2>/dev/null || true
          scripts/config --enable KSU_SUSFS_SUS_UMOUNT 2>/dev/null || true
          scripts/config --enable KSU_SUSFS_SUS_STAT 2>/dev/null || true
          scripts/config --enable KSU_SUSFS_SUS_OPENAT 2>/dev/null || true
          scripts/config --enable KSU_SUSFS_SUS_GETDENTS 2>/dev/null || true
          
          make -s -j$(nproc --all) O=out ARCH=arm64 olddefconfig
          
          echo "=== 关键配置校验 ==="
          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_MODULE_SIG|CONFIG_KSU_SUSFS" out/.config || true
          
          # 编译内核（完全照搬你的 make 参数）
          make -j$(nproc --all) CC="ccache clang" O=out ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld \
            2>&1 | tee build.log
          
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ Kernel Image not found!"
            tail -100 build.log
            exit 1
          fi
          
          if [ -f out/drivers/kernel/ksu/ksu.ko ]; then
            echo "✅ KSU module (ksu.ko) built"
          elif [ -f out/drivers/kernel/ksu/ksu.o ]; then
            echo "✅ KSU built-in"
          else
            echo "⚠️ KSU object not found"
            find out -name "*ksu*" -type f 2>/dev/null | head -10
          fi
          
          echo "✅ Kernel Image built successfully"

      # ═══════════════════════════════════
      # 9️⃣ 编译 DTB —— **完全照搬你给的能跑通工作流**
      # ═══════════════════════════════════
      - name: Build DTB
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          PATH: ${GITHUB_WORKSPACE}/kernel_workspace/clang-aosp/bin:${GITHUB_WORKSPACE}/kernel_workspace/gcc64/bin:${GITHUB_WORKSPACE}/kernel_workspace/gcc32/bin:${PATH}
        run: |
          make O=out ARCH=arm64 dtbs -j$(nproc --all) 2>&1 | tee -a build.log

      # 1️⃣0️⃣ 打包镜像
      - name: Package kernel images
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          cd out/arch/arm64/boot
          
          gzip -c -9 Image > Image.gz
          lz4 -c -l -9 Image > Image.lz4
          
          DTB_FILES=""
          for d in ../dtb/ dts/; do
            if [ -d "$d" ]; then
              DTB_FILES=$(find "$d" -name "*.dtb" -type f 2>/dev/null | head -50)
              [ -n "$DTB_FILES" ] && break
            fi
          done
          
          if [ -n "$DTB_FILES" ]; then
            echo "Found DTBs: $DTB_FILES"
            cat Image.gz $DTB_FILES > Image.gz-dtb
            cat Image.lz4 $DTB_FILES > Image.lz4-dtb
          else
            echo "⚠️ No DTB found"
            cp Image.gz Image.gz-dtb
            cp Image.lz4 Image.lz4-dtb
          fi
          
          mkdir -p ../../../../artifact
          cp Image.gz Image.gz-dtb Image.lz4 Image.lz4-dtb ../../../../artifact/
          cp ../dtb/*.dtb ../../../../artifact/ 2>/dev/null || true
          cp .config ../../../../artifact/config_final
          
          if [ -f ../drivers/kernel/ksu/ksu.ko ]; then
            cp ../drivers/kernel/ksu/ksu.ko ../../../../artifact/
            echo "✅ KSU module copied to artifacts"
          fi

      # 1️⃣1️⃣ AnyKernel3 ZIP（照搬你的打包方式）
      - name: Package AnyKernel3
        if: github.event.inputs.build_type == 'release'
        run: |
          cd ${GITHUB_WORKSPACE}
          git clone https://github.com/Winkmoon/AnyKernel3
          cp ${GITHUB_WORKSPACE}/${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          rm -rf AnyKernel3/.git* AnyKernel3/README.md
          cd AnyKernel3
          zip -r ../artifact/ShirokoNeko-kernel-FolkPatch-KSU-susfs.zip .

      # 1️⃣2️⃣ Magisk 模块
      - name: Package Magisk Module
        if: github.event.inputs.build_type == 'release'
        run: |
          cd ${GITHUB_WORKSPACE}
          mkdir -p magisk_module/kernel
          cp ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz-dtb magisk_module/kernel/
          
          if [ -f ${{ env.KERNEL_DIR }}/out/drivers/kernel/ksu/ksu.ko ]; then
            mkdir -p magisk_module/modules
            cp ${{ env.KERNEL_DIR }}/out/drivers/kernel/ksu/ksu.ko magisk_module/modules/
          fi
          
          cat > magisk_module/module.prop << MAGEOF
          id=xinran_ksu_susfs_kernel_chopin
          name=Xinran Kernel + KSU + susfs (Chopin MT6891)
          version=$(date +%Y%m%d)
          versionCode=$(date +%s)
          author=lbm76/Xinran + tiann/KernelSU + sidex15/susfs4ksu
          description=Dimensity 1100 kernel with KernelSU + susfs (stock frequencies/voltages)
          minMagisk=23000
          MAGEOF
          
          cat > magisk_module/customize.sh << 'SHOEF'
          #!/bin/sh
          SKIPMOUNT=false
          PROPFILE=false
          POSTFSDATA=true
          LATESTARTSERVICE=false
          
          on_install() {
            ui_print "- Installing Xinran Kernel + KSU + susfs for Chopin..."
            ui_print "- Flashing boot image..."
            if [ -f \$MODPATH/modules/ksu.ko ]; then
              ui_print "- Installing KernelSU module..."
            fi
            ui_print "- Done! Reboot to take effect."
          }
          SHOEF
          
          cd magisk_module
          zip -r9 ../artifact/Magisk-Xinran-KSU-susfs-Chopin-$(date +%Y%m%d).zip .
          echo "✅ Magisk module ZIP created"

      # 1️⃣3️⃣ 上传产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xinran-ksu-susfs-chopin-${{ env.BUILD_TYPE }}-${{ github.run_number }}
          path: |
            artifact/
            ${{ env.KERNEL_DIR }}/build.log
            ${{ env.KERNEL_DIR }}/ksu_patch.log
            ${{ env.KERNEL_DIR }}/susfs_patch.log
          retention-days: 30

      # 1️⃣4️⃣ 创建 Release（照搬你的命名风格）
      - name: Create Release
        if: github.event.inputs.build_type == 'release' && github.repository_owner == github.actor
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v$(date +'%Y.%m.%d')-${{ github.run_number }}
          name: "Xinran+KSU+susfs Chopin (MT6891) $(date +'%Y.%m.%d')"
          body: |
            **Redmi Note 10 Pro (chopin) - Dimensity 1100 (MT6891)**
            
            **Build Env (from your working workflow)**
            - Ubuntu 22.04 + crDroid Clang-6443078 (10.0) + GCC 4.9 (android-12.1.0_r27)
            - Kernel: `lbm76/xinran_xiaomi_kernel_chopin@xinran` (4.14)
            - KernelSU: `tiann/KernelSU@v0.9.5`
            - susfs4ksu: `sidex15/susfs4ksu@v0.9.5`
            
            **Features**
            - KernelSU support (module or built-in)
            - susfs4ksu (hide root, pass Play Integrity)
            - Stock frequencies & voltages (no OC/UV)
            
            **Artifacts**
            - `ShirokoNeko-kernel-FolkPatch-KSU-susfs.zip` → **Recovery 刷入**
            - `Magisk-Xinran-KSU-susfs-Chopin-*.zip` → Magisk 模块
            - `ksu.ko` + `config_final` + `build.log`
          files: artifact/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
